config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cessda/cessda.fair-tests:
      branch: main
      repo: https://github.com/cessda/cessda.fair-tests.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cessda/cessda.fair-tests git:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-cinnabar-squirrel.sh
        container: qc.acc_hazy-celadon-slug
  QC.Doc:
    repos:
      github.com/cessda/cessda.fair-tests find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.sunny-seashell-dragon.sh
        container: qc.doc_lanky-alizarin-tortoise
      github.com/cessda/cessda.fair-tests git:
        commands:
        - /usr/bin/env sh .sqa/script.boozy-wisteria-mongrel.sh
        container: qc.doc_cranky-brass-chimpanzee
      github.com/cessda/cessda.fair-tests markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.stuffy-alizarin-grasshopper.sh
        container: qc.doc_jumpy-amber-angora
  QC.Lic:
    repos:
      github.com/cessda/cessda.fair-tests licensee:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-cinnabar-ladybird.sh
        container: qc.lic_gummy-tomato-clam
  QC.Met:
    repos:
      github.com/cessda/cessda.fair-tests cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.queasy-taupe-penguin.sh
        container: qc.met_skimpy-burgundy-vulture
  QC.Sty:
    repos:
      github.com/cessda/cessda.fair-tests checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-green-bandicoot.sh
        container: qc.sty_skanky-azure-binturong
  QC.Ver:
    repos:
      github.com/cessda/cessda.fair-tests get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-aquamarine-dhole.sh
        container: qc.ver_clammy-cobalt-flounder
timeout: 5400
